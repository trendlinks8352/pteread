<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE Academic Collocation Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e14;
    --surface: #16161f;
    --surface2: #1e1e2a;
    --border: rgba(255,255,255,0.08);
    --accent: #a78bfa;
    --accent2: #7c3aed;
    --accent-dim: rgba(167,139,250,0.12);
    --text: #f0eeff;
    --text-muted: #8882aa;
    --text-faint: #4a4766;
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  /* noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 640px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  .header-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(167,139,250,0.2);
    padding: 4px 14px;
    border-radius: 99px;
    margin-bottom: 1rem;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 400;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  .header h1 span { color: var(--accent); }
  .header p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Progress */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .progress-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .progress-text { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .score-badge {
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 3px 10px;
    border-radius: 99px;
    white-space: nowrap;
  }

  /* Question card */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1rem;
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 1rem;
  }
  .q-type-badge::before {
    content: '';
    display: block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .q-text {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 1.5rem;
  }
  .blank {
    display: inline-block;
    border-bottom: 2px solid var(--accent);
    color: var(--accent);
    font-weight: 500;
    min-width: 80px;
    padding: 0 4px;
  }

  /* Fill-in options */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .opt-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 16px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: rgba(167,139,250,0.4);
    background: var(--accent-dim);
    color: var(--text);
  }
  .opt-btn.correct {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
  }
  .opt-btn.wrong {
    border-color: var(--red);
    background: var(--red-dim);
    color: var(--red);
  }

  /* Match */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .match-col-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .match-items { display: flex; flex-direction: column; gap: 6px; }
  .match-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    min-height: 42px;
    display: flex;
    align-items: center;
  }
  .match-item:hover:not(.matched):not(.wrong-flash) {
    border-color: rgba(167,139,250,0.4);
    color: var(--text);
  }
  .match-item.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }
  .match-item.matched {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
    cursor: default;
  }
  .match-item.wrong-flash {
    border-color: var(--red);
    background: var(--red-dim);
    color: var(--red);
  }

  /* Feedback */
  .feedback {
    margin-top: 1rem;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    line-height: 1.5;
    animation: fadeUp 0.2s ease;
  }
  .feedback.ok { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
  .feedback.no { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }

  /* Next button */
  .next-btn {
    width: 100%;
    background: var(--accent2);
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    margin-top: 0.75rem;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .next-btn:hover { background: #6d28d9; }
  .next-btn:active { transform: scale(0.99); }

  /* Final */
  .final-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3rem 2rem;
    text-align: center;
    animation: fadeUp 0.3s ease;
  }
  .final-score-wrap {
    margin-bottom: 1.5rem;
  }
  .final-score {
    font-family: 'DM Serif Display', serif;
    font-size: 72px;
    font-weight: 400;
    color: var(--accent);
    line-height: 1;
  }
  .final-denom {
    font-size: 24px;
    color: var(--text-faint);
  }
  .final-msg {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .final-pct {
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 2rem;
  }
  .final-stars {
    font-size: 28px;
    margin-bottom: 1.5rem;
    letter-spacing: 4px;
  }
  .restart-btn {
    background: transparent;
    border: 1px solid rgba(167,139,250,0.4);
    border-radius: var(--radius-sm);
    padding: 12px 32px;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .restart-btn:hover { background: var(--accent-dim); border-color: var(--accent); }

  .hint { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 0.5rem; }

  @media (max-width: 480px) {
    .options { grid-template-columns: 1fr; }
    .match-grid { grid-template-columns: 1fr 1fr; }
    .q-text { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-tag">Pearson PTE Academic</div>
    <h1>Collocation <span>Quiz</span></h1>
    <p>Academic Collocation List (A–G) · 빈칸 채우기 + 매칭 혼합</p>
  </div>
  <div id="app"></div>
</div>

<script>
const ALL_QUESTIONS = [
  {type:'fill', sentence:'The study found __ evidence supporting the hypothesis.', answer:'ample', options:['ample','general','slight','common']},
  {type:'fill', sentence:'She conducted an __ analysis of the data.', answer:'analytical', options:['analytical','emotional','manual','vague']},
  {type:'fill', sentence:'They held an __ conference to share the findings.', answer:'annual', options:['annual','optional','informal','local']},
  {type:'fill', sentence:'The new policy may __ affect the learning environment.', answer:'adversely', options:['adversely','gradually','broadly','deeply']},
  {type:'fill', sentence:'They need to __ resources wisely across departments.', answer:'allocate', options:['allocate','discover','collect','publish']},
  {type:'fill', sentence:'Researchers used __ data to draw conclusions.', answer:'available', options:['available','missing','anecdotal','binary']},
  {type:'fill', sentence:'The team plans to __ research into this topic next year.', answer:'conduct', options:['conduct','ignore','reduce','display']},
  {type:'fill', sentence:'The report presents __ evidence for the new theory.', answer:'compelling', options:['compelling','fragile','vague','artificial']},
  {type:'fill', sentence:'The review gave a __ overview of current trends.', answer:'comprehensive', options:['comprehensive','narrow','brief','random']},
  {type:'fill', sentence:'The results show a __ pattern across all groups.', answer:'consistent', options:['consistent','dramatic','hostile','ambiguous']},
  {type:'fill', sentence:'Researchers must __ data before drawing any conclusions.', answer:'collect', options:['collect','discard','avoid','invent']},
  {type:'fill', sentence:'The discovery brought a __ change to the field.', answer:'dramatic', options:['dramatic','minor','careful','static']},
  {type:'fill', sentence:'The report uses a __ framework to analyse results.', answer:'conceptual', options:['conceptual','random','distant','vague']},
  {type:'fill', sentence:'All participants gave their __ consent to take part.', answer:'informed', options:['informed','verbal','quiet','brief']},
  {type:'fill', sentence:'The team made a __ effort to complete the project on time.', answer:'concerted', options:['concerted','passive','broken','separate']},
  {type:'fill', sentence:'She tried to __ an approach that balanced both views.', answer:'adopt', options:['adopt','eliminate','contest','report']},
  {type:'fill', sentence:'The government must __ an issue of great importance.', answer:'address', options:['address','ignore','copy','collect']},
  {type:'fill', sentence:'Climate __ is one of the most urgent global issues.', answer:'change', options:['change','event','analysis','reform']},
  {type:'fill', sentence:'The experiment required __ conditions to be valid.', answer:'controlled', options:['controlled','random','unclear','complex']},
  {type:'fill', sentence:'The two groups showed a __ distinction in their outcomes.', answer:'clear', options:['clear','vague','sudden','loud']},
  {type:'match', pairs:[['accept','responsibility'],['accurate','assessment'],['achieve','goal'],['acquire','knowledge']]},
  {type:'match', pairs:[['cast','doubt'],['causal','link'],['central','concern'],['clear','evidence']]},
  {type:'match', pairs:[['collect','data'],['common','assumption'],['conduct','research'],['considerable','attention']]},
  {type:'match', pairs:[['draw','conclusion'],['develop','strategy'],['direct','impact'],['driving','force']]},
  {type:'match', pairs:[['early','decades'],['economic','growth'],['effective','communication'],['empirical','evidence']]},
  {type:'match', pairs:[['gain','access'],['gather','information'],['global','context'],['growing','awareness']]},
  {type:'match', pairs:[['give','feedback'],['general','consensus'],['basic','assumption'],['background','knowledge']]},
  {type:'match', pairs:[['affect','outcome'],['allow','access'],['apply','method'],['broad','range']]},
  {type:'match', pairs:[['become','apparent'],['begin','process'],['briefly','describe'],['changing','circumstances']]},
  {type:'match', pairs:[['conflicting','interests'],['convince','evidence'],['core','skills'],['create','conditions']]},
];

let questions = [];
let current = 0;
let score = 0;
let answered = false;
let matchState = {};

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function init() {
  const fills = shuffle(ALL_QUESTIONS.filter(q => q.type === 'fill')).slice(0, 6);
  const matches = shuffle(ALL_QUESTIONS.filter(q => q.type === 'match')).slice(0, 4);
  questions = shuffle([...fills, ...matches]);
  current = 0; score = 0; answered = false; matchState = {};
  render();
}

function render() {
  const app = document.getElementById('app');
  if (current >= questions.length) { renderFinal(app); return; }

  const q = questions[current];
  const prog = Math.round((current / questions.length) * 100);

  let html = `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
      <span class="progress-text">${current + 1} / ${questions.length}</span>
      <span class="score-badge">✦ ${score}</span>
    </div>`;

  if (q.type === 'fill') {
    const disp = q.sentence.replace('__', `<span class="blank" id="blank-slot">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
    const opts = shuffle(q.options);
    html += `<div class="q-card">
      <div class="q-type-badge">빈칸 채우기</div>
      <div class="q-text">${disp}</div>
      <div class="options" id="opts">
        ${opts.map(o => `<button class="opt-btn" onclick="checkFill('${o}')">${o}</button>`).join('')}
      </div>
      <div id="fb"></div>
    </div>`;
  } else {
    const lefts = shuffle(q.pairs.map(p => p[0]));
    const rights = shuffle(q.pairs.map(p => p[1]));
    matchState = { pairs: q.pairs, lefts, rights, selectedLeft: null, matched: [], totalCorrect: q.pairs.length };
    html += `<div class="q-card">
      <div class="q-type-badge">매칭하기 — 왼쪽 선택 후 오른쪽 선택</div>
      <div class="match-grid">
        <div>
          <div class="match-col-label">단어 1</div>
          <div class="match-items" id="left-col">
            ${lefts.map(l => `<div class="match-item" id="L_${l}" onclick="selectLeft('${l}')">${l}</div>`).join('')}
          </div>
        </div>
        <div>
          <div class="match-col-label">단어 2</div>
          <div class="match-items" id="right-col">
            ${rights.map(r => `<div class="match-item" id="R_${r}" onclick="selectRight('${r}')">${r}</div>`).join('')}
          </div>
        </div>
      </div>
      <div id="fb"></div>
    </div>`;
  }

  if (answered) {
    html += `<button class="next-btn" onclick="next()">${current + 1 < questions.length ? '다음 문제 →' : '결과 보기 →'}</button>`;
  } else if (q.type === 'fill') {
    html += `<p class="hint">보기 중 알맞은 단어를 선택하세요</p>`;
  } else {
    html += `<p class="hint">왼쪽 단어를 먼저 클릭한 뒤 오른쪽 단어를 클릭하세요</p>`;
  }

  app.innerHTML = html;
}

function checkFill(chosen) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  document.querySelectorAll('.opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
    else if (b.textContent === chosen) b.classList.add('wrong');
  });
  const slot = document.getElementById('blank-slot');
  if (slot) slot.textContent = q.answer;
  const fb = document.getElementById('fb');
  if (chosen === q.answer) {
    score++;
    fb.innerHTML = `<div class="feedback ok">✓ 정답이에요! <strong>${q.answer}</strong>가 맞습니다.</div>`;
  } else {
    fb.innerHTML = `<div class="feedback no">✗ 틀렸어요. 정답은 <strong>${q.answer}</strong> 입니다.</div>`;
  }
  const nextLabel = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 →';
  document.getElementById('app').insertAdjacentHTML('beforeend', `<button class="next-btn" onclick="next()">${nextLabel}</button>`);
}

function selectLeft(word) {
  if (matchState.matched.includes(word)) return;
  matchState.selectedLeft = word;
  matchState.lefts.forEach(l => {
    const el = document.getElementById('L_' + l);
    if (!el) return;
    if (matchState.matched.includes(l)) { el.className = 'match-item matched'; return; }
    el.className = l === word ? 'match-item selected' : 'match-item';
  });
}

function selectRight(word) {
  if (!matchState.selectedLeft) return;
  if (matchState.matched.includes(word)) return;
  const left = matchState.selectedLeft;
  const correctRight = matchState.pairs.find(p => p[0] === left)?.[1];
  const lel = document.getElementById('L_' + left);
  const rel = document.getElementById('R_' + word);

  if (word === correctRight) {
    matchState.matched.push(left);
    if (lel) lel.className = 'match-item matched';
    if (rel) rel.className = 'match-item matched';
    matchState.selectedLeft = null;
    if (matchState.matched.length === matchState.totalCorrect) {
      score++;
      const fb = document.getElementById('fb');
      if (fb) fb.innerHTML = `<div class="feedback ok" style="margin-top:12px">✓ 모두 맞았어요! 완벽합니다.</div>`;
      answered = true;
      const nextLabel = current + 1 < questions.length ? '다음 문제 →' : '결과 보기 →';
      document.getElementById('app').insertAdjacentHTML('beforeend', `<button class="next-btn" onclick="next()">${nextLabel}</button>`);
    }
  } else {
    if (lel) { lel.className = 'match-item wrong-flash'; setTimeout(() => { if (!matchState.matched.includes(left) && lel) lel.className = 'match-item'; }, 500); }
    if (rel) { rel.className = 'match-item wrong-flash'; setTimeout(() => { if (!matchState.matched.includes(word) && rel) rel.className = 'match-item'; }, 500); }
    matchState.selectedLeft = null;
    matchState.lefts.forEach(l => {
      const el = document.getElementById('L_' + l);
      if (el && !matchState.matched.includes(l)) el.className = 'match-item';
    });
  }
}

function next() {
  current++;
  answered = false;
  matchState = {};
  render();
}

function renderFinal(app) {
  const pct = Math.round((score / questions.length) * 100);
  let stars = '★★★★★';
  let msg = '';
  if (pct >= 90) { stars = '★★★★★'; msg = '완벽해요! 콜로케이션 마스터!'; }
  else if (pct >= 70) { stars = '★★★★☆'; msg = '훌륭해요! 거의 다 맞았네요.'; }
  else if (pct >= 50) { stars = '★★★☆☆'; msg = '잘 했어요! 조금만 더 연습해봐요.'; }
  else { stars = '★★☆☆☆'; msg = '계속 연습하면 늘어요! 파이팅!'; }
  app.innerHTML = `
    <div class="final-card">
      <div class="final-stars">${stars}</div>
      <div class="final-score-wrap">
        <span class="final-score">${score}</span>
        <span class="final-denom"> / ${questions.length}</span>
      </div>
      <div class="final-msg">${msg}</div>
      <div class="final-pct">정답률 ${pct}%</div>
      <button class="restart-btn" onclick="init()">다시 풀기 ↺</button>
    </div>`;
}

init();
</script>
</body>
</html>
