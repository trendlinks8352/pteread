<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE Reading — 오답노트</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #18181f;
    --border: #2a2a38;
    --accent: #c8f53a;
    --accent2: #5b8cff;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --correct: #3affa0;
    --wrong: #ff5b5b;
    --warn: #ffd93a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 20%, #1a1a2e 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, #0d1f12 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; }

  /* ─── HEADER ─── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    background: rgba(10,10,15,0.85);
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .logo span { color: var(--muted); font-size: 14px; font-family: 'DM Mono', monospace; letter-spacing: 1px; display: block; margin-top: -4px; }

  .nav-tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }

  .nav-tab {
    padding: 8px 20px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .nav-tab.active {
    background: var(--accent);
    color: #0a0a0f;
    font-weight: 500;
  }

  .nav-tab:hover:not(.active) { color: var(--text); background: var(--card); }

  .stats-header {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat-pill {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-pill b { color: var(--accent); font-size: 16px; }

  /* ─── PAGES ─── */
  .page { display: none; padding: 40px; max-width: 1100px; margin: 0 auto; }
  .page.active { display: block; }

  /* ─── DASHBOARD ─── */
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }

  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .metric-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    border-radius: 0 14px 0 100%;
    background: var(--accent);
    opacity: 0.06;
  }

  .metric-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .metric-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .metric-sub {
    font-size: 12px;
    color: var(--muted);
  }

  /* Calendar heatmap */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .heatmap-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 32px;
    overflow-x: auto;
  }

  .heatmap {
    display: flex;
    gap: 4px;
    min-width: fit-content;
  }

  .heatmap-col { display: flex; flex-direction: column; gap: 4px; }

  .heatmap-cell {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--border);
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
  }

  .heatmap-cell:hover { transform: scale(1.4); z-index: 10; }
  .heatmap-cell[data-count="1"] { background: #1a3a1a; }
  .heatmap-cell[data-count="2"] { background: #1e5c1e; }
  .heatmap-cell[data-count="3"] { background: #28852a; }
  .heatmap-cell[data-count="4"] { background: #3db542; }
  .heatmap-cell[data-count="5"] { background: var(--correct); }

  /* Recent activity */
  .activity-list { display: flex; flex-direction: column; gap: 10px; }

  .activity-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s;
  }

  .activity-item:hover { border-color: var(--accent); }

  .activity-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 80px;
  }

  .activity-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid;
  }

  .tag-fib { color: #5b8cff; border-color: #5b8cff40; background: #5b8cff10; }
  .tag-mcm { color: var(--warn); border-color: #ffd93a40; background: #ffd93a10; }
  .tag-ro  { color: var(--correct); border-color: #3affa040; background: #3affa010; }
  .tag-mcs { color: #ff8c5b; border-color: #ff8c5b40; background: #ff8c5b10; }
  .tag-rwfib { color: #c85bff; border-color: #c85bff40; background: #c85bff10; }

  .activity-question {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .activity-result {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  .result-correct { color: var(--correct); }
  .result-wrong { color: var(--wrong); }

  /* ─── QUIZ PAGE ─── */
  .quiz-controls {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn.active, .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200,245,58,0.07);
  }

  .quiz-mode-btn {
    margin-left: auto;
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0a0a0f;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .quiz-mode-btn:hover { background: #d4f954; transform: translateY(-1px); }

  /* Quiz card */
  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }

  .quiz-card.correct { border-color: var(--correct); background: rgba(58,255,160,0.04); }
  .quiz-card.wrong   { border-color: var(--wrong);   background: rgba(255,91,91,0.04); }

  .quiz-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
  }

  .quiz-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .quiz-passage {
    background: var(--surface);
    border-left: 3px solid var(--accent2);
    border-radius: 0 8px 8px 0;
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 20px;
    white-space: pre-wrap;
  }

  .quiz-question {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  /* FIB blank */
  .blank {
    display: inline-block;
    border-bottom: 2px solid var(--accent);
    min-width: 80px;
    margin: 0 4px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    cursor: pointer;
    padding: 0 4px;
    transition: background 0.2s;
    border-radius: 2px;
  }

  .blank:hover { background: rgba(200,245,58,0.1); }
  .blank.filled { background: rgba(200,245,58,0.08); }
  .blank.correct-fill { border-color: var(--correct); color: var(--correct); background: rgba(58,255,160,0.1); }
  .blank.wrong-fill  { border-color: var(--wrong);   color: var(--wrong);   background: rgba(255,91,91,0.1); }

  /* Options */
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }

  .option-btn {
    padding: 12px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent2);
    background: rgba(91,140,255,0.08);
  }

  .option-btn.selected { border-color: var(--accent2); background: rgba(91,140,255,0.12); }
  .option-btn.option-correct { border-color: var(--correct); background: rgba(58,255,160,0.1); color: var(--correct); }
  .option-btn.option-wrong   { border-color: var(--wrong);   background: rgba(255,91,91,0.1);  color: var(--wrong); }
  .option-btn:disabled { cursor: default; }

  /* RO drag */
  .ro-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  .ro-source, .ro-target {
    flex: 1;
    min-height: 120px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ro-target { border-color: var(--accent2); }

  .ro-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .ro-item {
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    cursor: grab;
    transition: all 0.2s;
    user-select: none;
  }

  .ro-item:active { cursor: grabbing; opacity: 0.7; }
  .ro-item:hover { border-color: var(--accent2); }
  .ro-item.drag-over { border-color: var(--accent); background: rgba(200,245,58,0.05); }

  /* Action buttons */
  .quiz-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    padding: 10px 22px;
    border-radius: 8px;
    border: 1px solid;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 500; }
  .btn-primary:hover { background: #d4f954; }
  .btn-secondary { background: transparent; color: var(--muted); border-color: var(--border); }
  .btn-secondary:hover { color: var(--text); border-color: var(--text); }

  .explanation-box {
    margin-top: 20px;
    padding: 16px 20px;
    background: rgba(91,140,255,0.07);
    border: 1px solid rgba(91,140,255,0.2);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    display: none;
  }

  .explanation-box.show { display: block; }
  .explanation-box strong { color: var(--accent2); }

  /* quiz session mode overlay */
  .quiz-session {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    overflow-y: auto;
    padding: 40px;
  }

  .quiz-session.active { display: block; }

  .session-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .session-progress {
    flex: 1;
    max-width: 300px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 24px;
  }

  .session-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .session-counter {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  /* Score screen */
  .score-screen {
    text-align: center;
    padding: 60px 0;
  }

  .score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 120px;
    line-height: 1;
    color: var(--accent);
  }

  .score-label {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 40px;
  }

  /* ─── ADD PAGE ─── */
  .add-form {
    max-width: 700px;
    margin: 0 auto;
  }

  .form-group {
    margin-bottom: 24px;
  }

  .form-label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
  }

  .form-textarea {
    min-height: 100px;
    resize: vertical;
    line-height: 1.6;
  }

  .form-select option { background: var(--card); }

  /* Dynamic options list */
  .options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }

  .option-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .option-row input { flex: 1; }

  .correct-radio {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }

  .correct-radio input[type="checkbox"] { accent-color: var(--correct); }

  .add-option-btn {
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .add-option-btn:hover { border-color: var(--accent); color: var(--accent); }

  .remove-option-btn {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }

  .remove-option-btn:hover { border-color: var(--wrong); color: var(--wrong); }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0a0a0f;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .submit-btn:hover { background: #d4f954; transform: translateY(-2px); }

  /* JSON import/export */
  .import-export {
    display: flex;
    gap: 10px;
    margin-bottom: 32px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    align-items: center;
  }

  .import-export-title {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-right: auto;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 14px 20px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    z-index: 9999;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s;
  }

  .toast.show { transform: translateY(0); opacity: 1; }

  /* Responsive */
  @media (max-width: 768px) {
    header { padding: 16px 20px; }
    .page { padding: 20px; }
    .dash-grid { grid-template-columns: repeat(2, 1fr); }
    .metric-value { font-size: 36px; }
    .ro-container { flex-direction: column; }
  }

  /* FIB Word Bank (dropdown style) */
  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .bank-word {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .bank-word:hover { border-color: var(--accent); color: var(--accent); }
  .bank-word.used { opacity: 0.3; pointer-events: none; }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .quiz-card { animation: fadeInUp 0.3s ease; }

  .pulse {
    animation: pulse 0.4s ease;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div class="wrapper">

<!-- HEADER -->
<header>
  <div class="logo">
    PTE·VAULT
    <span>Reading 오답노트</span>
  </div>
  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('dashboard')">📊 대시보드</button>
    <button class="nav-tab" onclick="showPage('quiz')">🧠 퀴즈</button>
    <button class="nav-tab" onclick="showPage('add')">➕ 오답 추가</button>
  </nav>
  <div class="stats-header">
    <div class="stat-pill"><b id="hdr-total">0</b> 문제</div>
    <div class="stat-pill"><b id="hdr-acc">—</b> 정답률</div>
  </div>
</header>

<!-- ═══════════════════ DASHBOARD ═══════════════════ -->
<div id="page-dashboard" class="page active">

  <div class="dash-grid">
    <div class="metric-card">
      <div class="metric-label">총 오답 문제</div>
      <div class="metric-value" id="m-total">0</div>
      <div class="metric-sub">누적 등록 문항</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">오늘 푼 문제</div>
      <div class="metric-value" id="m-today">0</div>
      <div class="metric-sub" id="m-today-date">—</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">전체 정답률</div>
      <div class="metric-value" id="m-acc">—</div>
      <div class="metric-sub" id="m-acc-sub">아직 퀴즈 기록 없음</div>
    </div>
  </div>

  <div class="section-title">학습 히트맵 (최근 16주)</div>
  <div class="heatmap-wrap">
    <div class="heatmap" id="heatmap"></div>
  </div>

  <div class="section-title">유형별 현황</div>
  <div class="activity-list" id="type-stats"></div>

  <br>
  <div class="section-title">카테고리별 정답률</div>
  <div class="activity-list" id="cat-stats"></div>

  <br>
  <div class="section-title">최근 퀴즈 기록</div>
  <div class="activity-list" id="activity-list">
    <div style="color:var(--muted);font-size:13px;text-align:center;padding:30px;">아직 퀴즈 기록이 없어요. 퀴즈를 풀어보세요!</div>
  </div>
</div>

// ═══════════════════════════════════════════════
//  DATA LAYER
//  문제: QUESTIONS 상수 (위에서 관리)
//  기록: localStorage (퀴즈 history + 직접 추가 문제)
// ═══════════════════════════════════════════════

let DB = {
  questions: [],
  history: []
};

function loadDB() {
  // localStorage에서 history + 직접 추가 문제 로드
  let local = { questions: [], history: [] };
  try {
    const raw = localStorage.getItem('pte-vault');
    if (raw) local = JSON.parse(raw);
  } catch(e) {}

  // QUESTIONS 기준으로 병합 (중복 제거)
  const builtinIds = new Set(QUESTIONS.map(q => q.id));
  const localExtra = (local.questions || []).filter(q => !builtinIds.has(q.id));

  DB.questions = [...QUESTIONS, ...localExtra];
  DB.history   = local.history || [];
}

function saveDB() {
  // QUESTIONS에 없는 직접 추가 문제 + history만 저장
  const builtinIds = new Set(QUESTIONS.map(q => q.id));
  const extra = DB.questions.filter(q => !builtinIds.has(q.id));
  localStorage.setItem('pte-vault', JSON.stringify({ questions: extra, history: DB.history }));
}

function getStats() {
  const total = DB.questions.length;
  const hist = DB.history;
  const correct = hist.filter(h => h.correct).length;
  const acc = hist.length ? Math.round(correct / hist.length * 100) : null;

  const today = todayStr();
  const todayCount = hist.filter(h => h.date === today).length;

  // per-type
  const types = {};
  DB.questions.forEach(q => {
    if (!types[q.type]) types[q.type] = { total: 0, attempts: 0, correct: 0 };
    types[q.type].total++;
  });
  hist.forEach(h => {
    const q = DB.questions.find(q => q.id === h.qid);
    if (!q) return;
    if (!types[q.type]) types[q.type] = { total: 0, attempts: 0, correct: 0 };
    types[q.type].attempts++;
    if (h.correct) types[q.type].correct++;
  });

  return { total, acc, todayCount, types };
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => {
    if (t.textContent.toLowerCase().includes(
      name === 'dashboard' ? '대시보드' : name === 'quiz' ? '퀴즈' : '오답'
    )) t.classList.add('active');
  });
  if (name === 'dashboard') renderDashboard();
  if (name === 'quiz') renderQuizList();
}

// ═══════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════

function renderDashboard() {
  const { total, acc, todayCount, types } = getStats();

  document.getElementById('m-total').textContent = total;
  document.getElementById('hdr-total').textContent = total;
  document.getElementById('m-today').textContent = todayCount;
  document.getElementById('m-today-date').textContent = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

  if (acc !== null) {
    document.getElementById('m-acc').textContent = acc + '%';
    document.getElementById('hdr-acc').textContent = acc + '%';
    document.getElementById('m-acc-sub').textContent = `${DB.history.filter(h=>h.correct).length} / ${DB.history.length} 정답`;
  }

  renderHeatmap();
  renderTypeStats(types);
  renderCatStats();
  renderActivity();
}

function renderHeatmap() {
  const el = document.getElementById('heatmap');
  el.innerHTML = '';
  const now = new Date();
  const days = 112; // 16 weeks

  // count by date
  const counts = {};
  DB.history.forEach(h => { counts[h.date] = (counts[h.date] || 0) + 1; });

  let col = null;
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const dow = d.getDay();
    const ds = d.toISOString().slice(0, 10);

    if (dow === 0 || col === null) {
      col = document.createElement('div');
      col.className = 'heatmap-col';
      el.appendChild(col);
    }

    const cell = document.createElement('div');
    cell.className = 'heatmap-cell';
    const c = counts[ds] || 0;
    cell.dataset.count = Math.min(c, 5);
    cell.title = ds + ' — ' + c + '문제';
    col.appendChild(cell);
  }
}

function renderTypeStats(types) {
  const el = document.getElementById('type-stats');
  el.innerHTML = '';
  const typeNames = { FIB: 'Fill in the Blanks', 'RW-FIB': 'R&W Fill in Blanks', MCM: 'Multiple Choice (Multi)', MCS: 'Multiple Choice (Single)', RO: 'Re-order Paragraphs' };
  const tagClass = { FIB:'tag-fib', 'RW-FIB':'tag-rwfib', MCM:'tag-mcm', MCS:'tag-mcs', RO:'tag-ro' };

  Object.entries(types).forEach(([type, s]) => {
    const acc = s.attempts ? Math.round(s.correct / s.attempts * 100) : null;
    const div = document.createElement('div');
    div.className = 'activity-item';
    div.innerHTML = `
      <span class="activity-tag ${tagClass[type] || ''}">${type}</span>
      <span class="activity-question">${typeNames[type] || type}</span>
      <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${s.total}문제</span>
      <span class="activity-result ${acc !== null && acc >= 70 ? 'result-correct' : 'result-wrong'}">${acc !== null ? acc + '%' : '미시도'}</span>
    `;
    el.appendChild(div);
  });

  if (!Object.keys(types).length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px;">아직 오답이 없어요.</div>';
  }
}

function renderCatStats() {
  const el = document.getElementById('cat-stats');
  if (!el) return;
  el.innerHTML = '';

  const cats = {
    collocation: { label: '🔗 Collocation 오류',  color: '#c85bff', total: 0, attempts: 0, correct: 0 },
    meaning:     { label: '💡 의미 착각',           color: '#ffd93a', total: 0, attempts: 0, correct: 0 },
    logic:       { label: '🧩 논리 흐름',           color: '#5b8cff', total: 0, attempts: 0, correct: 0 },
  };

  DB.questions.forEach(q => {
    const cat = getQuestionCategory(q);
    if (cats[cat]) cats[cat].total++;
  });

  DB.history.forEach(h => {
    const q = DB.questions.find(q => q.id === h.qid);
    if (!q) return;
    const cat = getQuestionCategory(q);
    if (!cats[cat]) return;
    cats[cat].attempts++;
    if (h.correct) cats[cat].correct++;
  });

  Object.entries(cats).forEach(([key, s]) => {
    const acc = s.attempts ? Math.round(s.correct / s.attempts * 100) : null;
    const div = document.createElement('div');
    div.className = 'activity-item';
    div.style.cursor = 'pointer';
    div.onclick = () => {
      showPage('quiz');
      // 카테고리 버튼 클릭 시뮬레이션
      setTimeout(() => {
        const btn = [...document.querySelectorAll('.cat-btn')].find(b => b.textContent.includes(
          key === 'collocation' ? 'Collocation' : key === 'meaning' ? '의미' : '논리'
        ));
        if (btn) filterCat(key, btn);
      }, 50);
    };
    div.innerHTML = `
      <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:${s.color};min-width:160px">${s.label}</span>
      <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)">${s.total}문제</span>
      <div style="flex:1;height:6px;background:var(--border);border-radius:3px;margin:0 16px;overflow:hidden">
        <div style="height:100%;width:${acc ?? 0}%;background:${s.color};border-radius:3px;transition:width 0.6s ease;opacity:0.8"></div>
      </div>
      <span style="font-family:'DM Mono',monospace;font-size:13px;color:${acc !== null ? (acc >= 70 ? 'var(--correct)' : 'var(--wrong)') : 'var(--muted)'};min-width:50px;text-align:right">${acc !== null ? acc + '%' : '미시도'}</span>
      <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-left:8px">→ 연습</span>
    `;
    el.appendChild(div);
  });
}
  const el = document.getElementById('activity-list');
  const recent = [...DB.history].reverse().slice(0, 15);
  if (!recent.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:30px;">아직 퀴즈 기록이 없어요.</div>'; return; }

  const tagClass = { FIB:'tag-fib', 'RW-FIB':'tag-rwfib', MCM:'tag-mcm', MCS:'tag-mcs', RO:'tag-ro' };
  el.innerHTML = '';
  recent.forEach(h => {
    const q = DB.questions.find(q => q.id === h.qid);
    if (!q) return;
    const div = document.createElement('div');
    div.className = 'activity-item';
    div.innerHTML = `
      <span class="activity-date">${h.date}</span>
      <span class="activity-tag ${tagClass[q.type] || ''}">${q.type}</span>
      <span class="activity-question">${q.passage ? q.passage.slice(0, 60) + '…' : q.question || '(문제 없음)'}</span>
      <span class="activity-result ${h.correct ? 'result-correct' : 'result-wrong'}">${h.correct ? '✓ 정답' : '✗ 오답'}</span>
    `;
    el.appendChild(div);
  });
}

let currentFilter = 'all';
let quizStates = {};

function filterCat(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateFilterBadge();
  renderQuizList();
}

function filterQuiz(cat, btn) { filterCat(cat, btn); }
function filterType(type, btn) {}  // 호환용 빈 함수

function updateFilterBadge() {
  const el = document.getElementById('filter-badge');
  const catLabel = { all:'📚 전체', collocation:'🔗 Collocation', meaning:'💡 의미 착각', logic:'🧩 논리 흐름', wrong:'❌ 오답만' };
  const qs = getFilteredQuestions();
  el.style.display = 'block';
  el.textContent = `${catLabel[currentFilter] || currentFilter}  —  ${qs.length}문제`;
}

function getFilteredQuestions() {
  let qs = DB.questions;
  if (currentFilter === 'wrong') {
    qs = qs.filter(q => {
      const attempts = DB.history.filter(h => h.qid === q.id);
      if (!attempts.length) return false;
      return !attempts[attempts.length - 1].correct;
    });
  } else if (currentFilter !== 'all') {
    qs = qs.filter(q => getQuestionCategory(q) === currentFilter);
  }
  return qs;
}

function renderQuizList() {
  const el = document.getElementById('quiz-list');
  const qs = getFilteredQuestions();

  if (!qs.length) {
    el.innerHTML = '<div style="color:var(--muted);font-size:14px;text-align:center;padding:60px;">문제가 없습니다. 오답을 추가해보세요!</div>';
    return;
  }

  el.innerHTML = '';
  qs.forEach((q, idx) => {
    el.appendChild(buildQuizCard(q, idx));
  });
}

function buildQuizCard(q, idx) {
  const div = document.createElement('div');
  div.className = 'quiz-card';
  div.id = 'qcard-' + q.id;

  const tagClass = { FIB:'tag-fib', 'RW-FIB':'tag-rwfib', MCM:'tag-mcm', MCS:'tag-mcs', RO:'tag-ro' };
  const catBadge = {
    collocation: `<span style="font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:10px;background:#c85bff15;color:#c85bff;border:1px solid #c85bff30">🔗 Collocation</span>`,
    meaning:     `<span style="font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:10px;background:#ffd93a15;color:#ffd93a;border:1px solid #ffd93a30">💡 의미착각</span>`,
    logic:       `<span style="font-family:'DM Mono',monospace;font-size:10px;padding:2px 8px;border-radius:10px;background:#5b8cff15;color:#5b8cff;border:1px solid #5b8cff30">🧩 논리흐름</span>`,
  };
  const state = quizStates[q.id] || {};

  let inner = `
    <div class="quiz-meta">
      <span class="quiz-num">#${(idx + 1).toString().padStart(2, '0')}</span>
      <span class="activity-tag ${tagClass[q.type] || ''}">${q.type}</span>
      ${catBadge[getQuestionCategory(q)] || ''}
      <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-left:auto">${q.date || ''}</span>
    </div>
  `;

  if (q.passage) {
    inner += `<div class="quiz-passage">${buildPassage(q)}</div>`;
  }
  if (q.question) {
    inner += `<div class="quiz-question">${q.question}</div>`;
  }

  inner += buildInteraction(q, state);

  inner += `
    <div class="quiz-actions" style="margin-top:16px">
      ${buildSubmitBtn(q, state)}
      <button class="btn btn-secondary" onclick="resetQuestion('${q.id}')">↺ 다시</button>
      ${q.memo ? `<span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)"># ${q.memo}</span>` : ''}
      <button class="btn btn-secondary" style="margin-left:auto;font-size:11px;color:var(--wrong)" onclick="deleteQuestion('${q.id}')">삭제</button>
    </div>
    <div class="explanation-box ${state.revealed ? 'show' : ''}" id="exp-${q.id}">
      <strong>해설</strong><br>${q.explanation || '해설이 없습니다.'}
    </div>
  `;

  div.innerHTML = inner;
  return div;
}

function buildPassage(q) {
  if (q.type === 'FIB' || q.type === 'RW-FIB') {
    let idx = 0;
    return (q.passage || '').replace(/\[BLANK\]/g, () => {
      const i = idx++;
      return `<span class="blank" id="blank-${q.id}-${i}" onclick="clickBlank('${q.id}',${i})" data-filled="">___</span>`;
    });
  }
  return q.passage || '';
}

function buildInteraction(q, state) {
  if (q.type === 'FIB' || q.type === 'RW-FIB') {
    const opts = q.options || [];
    return `
      <div class="word-bank" id="bank-${q.id}">
        ${opts.map((o, i) => `<span class="bank-word" id="bw-${q.id}-${i}" onclick="selectBankWord('${q.id}',${i},'${escQ(o)}')">${o}</span>`).join('')}
      </div>
    `;
  }

  if (q.type === 'MCM' || q.type === 'MCS') {
    const opts = q.options || [];
    return `
      <div class="options-grid">
        ${opts.map((o, i) => `
          <button class="option-btn ${state.selected && state.selected.includes(i) ? 'selected' : ''}"
            id="opt-${q.id}-${i}"
            onclick="toggleOption('${q.id}',${i},'${q.type}')">
            ${o.text}
          </button>
        `).join('')}
      </div>
    `;
  }

  if (q.type === 'RO') {
    const sentences = q.options || [];
    const shuffled = state.shuffled || shuffleArray([...sentences.map((s, i) => i)]);
    if (!state.shuffled) { if (!quizStates[q.id]) quizStates[q.id] = {}; quizStates[q.id].shuffled = shuffled; quizStates[q.id].order = []; }
    const order = (quizStates[q.id] || {}).order || [];
    const remaining = shuffled.filter(i => !order.includes(i));

    return `
      <div class="ro-container" id="ro-${q.id}">
        <div>
          <div class="ro-label">문장 목록 (클릭해서 순서 배치)</div>
          <div class="ro-source" id="ro-src-${q.id}">
            ${remaining.map(i => `<div class="ro-item" onclick="roPickItem('${q.id}',${i})">${sentences[i]}</div>`).join('')}
          </div>
        </div>
        <div>
          <div class="ro-label">정렬된 순서 (클릭해서 되돌리기)</div>
          <div class="ro-target" id="ro-tgt-${q.id}">
            ${order.map((i, pos) => `<div class="ro-item" onclick="roRemoveItem('${q.id}',${pos})">${sentences[i]}</div>`).join('')}
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

function buildSubmitBtn(q, state) {
  if (state.revealed) return `<button class="btn btn-primary" disabled>완료</button>`;
  return `<button class="btn btn-primary" onclick="submitAnswer('${q.id}')">정답 확인</button>`;
}

function escQ(s) { return (s || '').replace(/'/g, "\\'"); }

// Interaction handlers
let selectedBank = null; // {qid, idx, word}

function selectBankWord(qid, idx, word) {
  selectedBank = { qid, idx, word };
  document.querySelectorAll(`#bank-${qid} .bank-word`).forEach(b => b.style.outline = '');
  document.getElementById(`bw-${qid}-${idx}`).style.outline = '2px solid var(--accent)';
}

function clickBlank(qid, blankIdx) {
  if (!selectedBank || selectedBank.qid !== qid) return;
  const blankEl = document.getElementById(`blank-${qid}-${blankIdx}`);
  const prev = blankEl.dataset.filled;

  // unuse previous
  if (prev !== '') {
    const prevIdx = parseInt(prev);
    document.getElementById(`bw-${qid}-${prevIdx}`).classList.remove('used');
  }

  blankEl.textContent = selectedBank.word;
  blankEl.dataset.filled = selectedBank.idx;
  blankEl.classList.add('filled');
  document.getElementById(`bw-${qid}-${selectedBank.idx}`).classList.add('used');
  document.getElementById(`bw-${qid}-${selectedBank.idx}`).style.outline = '';
  selectedBank = null;
}

function toggleOption(qid, idx, type) {
  if (!quizStates[qid]) quizStates[qid] = {};
  if (!quizStates[qid].selected) quizStates[qid].selected = [];
  const sel = quizStates[qid].selected;
  const pos = sel.indexOf(idx);

  if (type === 'MCS') {
    quizStates[qid].selected = [idx];
  } else {
    if (pos === -1) sel.push(idx);
    else sel.splice(pos, 1);
  }

  // update UI
  const q = DB.questions.find(q => q.id === qid);
  if (!q) return;
  q.options.forEach((o, i) => {
    const btn = document.getElementById(`opt-${qid}-${i}`);
    if (!btn) return;
    btn.classList.toggle('selected', quizStates[qid].selected.includes(i));
  });
}

function roPickItem(qid, itemIdx) {
  if (!quizStates[qid]) quizStates[qid] = { order: [], shuffled: [] };
  quizStates[qid].order.push(itemIdx);
  rerenderRO(qid);
}

function roRemoveItem(qid, pos) {
  quizStates[qid].order.splice(pos, 1);
  rerenderRO(qid);
}

function rerenderRO(qid) {
  const q = DB.questions.find(q => q.id === qid);
  if (!q) return;
  const state = quizStates[qid];
  const sentences = q.options || [];
  const remaining = state.shuffled.filter(i => !state.order.includes(i));

  document.getElementById(`ro-src-${qid}`).innerHTML =
    remaining.map(i => `<div class="ro-item" onclick="roPickItem('${qid}',${i})">${sentences[i]}</div>`).join('');
  document.getElementById(`ro-tgt-${qid}`).innerHTML =
    state.order.map((i, pos) => `<div class="ro-item" onclick="roRemoveItem('${qid}',${pos})">${sentences[i]}</div>`).join('');
}

function submitAnswer(qid) {
  const q = DB.questions.find(q => q.id === qid);
  if (!q) return;
  const state = quizStates[qid] || {};
  let correct = false;

  if (q.type === 'FIB' || q.type === 'RW-FIB') {
    const answers = q.answers || [];
    let allCorrect = true;
    answers.forEach((ans, i) => {
      const blankEl = document.getElementById(`blank-${qid}-${i}`);
      if (!blankEl) { allCorrect = false; return; }
      const userAns = (blankEl.textContent || '').trim().toLowerCase();
      const isOk = userAns === ans.trim().toLowerCase();
      blankEl.classList.add(isOk ? 'correct-fill' : 'wrong-fill');
      if (!isOk) allCorrect = false;
    });
    correct = allCorrect;

  } else if (q.type === 'MCM' || q.type === 'MCS') {
    const correctIdxs = (q.options || []).map((o, i) => o.correct ? i : -1).filter(i => i !== -1);
    const userSel = state.selected || [];
    correct = arraysEqualSorted(correctIdxs, userSel);
    (q.options || []).forEach((o, i) => {
      const btn = document.getElementById(`opt-${qid}-${i}`);
      if (!btn) return;
      btn.disabled = true;
      if (o.correct) btn.classList.add('option-correct');
      else if (userSel.includes(i)) btn.classList.add('option-wrong');
    });

  } else if (q.type === 'RO') {
    const order = state.order || [];
    const correct_order = (q.options || []).map((_, i) => i);
    correct = JSON.stringify(order) === JSON.stringify(correct_order);
  }

  if (!quizStates[qid]) quizStates[qid] = {};
  quizStates[qid].revealed = true;
  quizStates[qid].lastCorrect = correct;

  // Save history
  DB.history.push({ date: todayStr(), qid, correct });
  saveDB();

  // Update card
  const card = document.getElementById('qcard-' + qid);
  if (card) {
    card.classList.add(correct ? 'correct' : 'wrong');
    card.classList.add('pulse');
    setTimeout(() => card.classList.remove('pulse'), 400);
  }

  const expEl = document.getElementById('exp-' + qid);
  if (expEl) expEl.classList.add('show');

  // Update action buttons
  const actionsEl = card ? card.querySelector('.quiz-actions') : null;
  if (actionsEl) {
    const submitBtn = actionsEl.querySelector('button');
    if (submitBtn) { submitBtn.textContent = correct ? '✓ 정답!' : '✗ 오답'; submitBtn.disabled = true; }
  }

  showToast(correct ? '✓ 정답입니다!' : '✗ 오답입니다. 해설을 확인하세요.');
}

function resetQuestion(qid) {
  delete quizStates[qid];
  renderQuizList();
}

function deleteQuestion(qid) {
  if (!confirm('이 문제를 삭제할까요?')) return;
  DB.questions = DB.questions.filter(q => q.id !== qid);
  DB.history = DB.history.filter(h => h.qid !== qid);
  saveDB();
  renderQuizList();
  renderDashboard();
  showToast('삭제되었습니다.');
}

function arraysEqualSorted(a, b) {
  return JSON.stringify([...a].sort()) === JSON.stringify([...b].sort());
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

//  SESSION MODE
// ═══════════════════════════════════════════════

let sessionQueue = [];
let sessionIdx = 0;
let sessionScore = 0;
let sessionStates = {};

function startSession() {
  sessionQueue = shuffleArray([...getFilteredQuestions()]);
  if (!sessionQueue.length) { showToast('문제가 없어요!'); return; }
  sessionIdx = 0;
  sessionScore = 0;
  sessionStates = {};
  document.getElementById('quiz-session').classList.add('active');
  renderSessionCard();
}

function endSession() {
  document.getElementById('quiz-session').classList.remove('active');
}

function renderSessionCard() {
  const total = sessionQueue.length;
  const progress = sessionIdx / total * 100;
  document.getElementById('session-progress-fill').style.width = progress + '%';
  document.getElementById('session-counter').textContent = `${sessionIdx} / ${total}`;

  if (sessionIdx >= total) {
    // Score screen
    document.getElementById('session-content').innerHTML = `
      <div class="score-screen">
        <div class="score-big">${Math.round(sessionScore / total * 100)}<span style="font-size:40px;color:var(--muted)">%</span></div>
        <div class="score-label">${sessionScore} / ${total} 정답</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button class="btn btn-primary" onclick="startSession()">다시 도전</button>
          <button class="btn btn-secondary" onclick="endSession()">퀴즈 목록으로</button>
        </div>
      </div>
    `;
    saveDB();
    return;
  }

  const q = sessionQueue[sessionIdx];
  const state = sessionStates[q.id] || {};
  const tagClass = { FIB:'tag-fib', 'RW-FIB':'tag-rwfib', MCM:'tag-mcm', MCS:'tag-mcs', RO:'tag-ro' };

  let html = `
    <div class="quiz-card" id="sq-card">
      <div class="quiz-meta">
        <span class="activity-tag ${tagClass[q.type] || ''}">${q.type}</span>
      </div>
  `;

  if (q.passage) html += `<div class="quiz-passage">${buildPassage(q)}</div>`;
  if (q.question) html += `<div class="quiz-question">${q.question}</div>`;
  html += buildInteraction(q, state);

  html += `
      <div class="quiz-actions" style="margin-top:16px" id="sq-actions">
        <button class="btn btn-primary" onclick="submitSessionAnswer('${q.id}')">정답 확인</button>
      </div>
      <div class="explanation-box" id="sq-exp">
        <strong>해설</strong><br>${q.explanation || '해설이 없습니다.'}
      </div>
    </div>
  `;

  document.getElementById('session-content').innerHTML = html;

  // Re-attach RO state
  if (q.type === 'RO') {
    if (!quizStates[q.id]) {
      quizStates[q.id] = { shuffled: shuffleArray([...(q.options || []).map((_,i)=>i)]), order: [] };
    }
    rerenderRO(q.id);
  }
}

function submitSessionAnswer(qid) {
  const q = DB.questions.find(q => q.id === qid);
  if (!q) return;
  const state = quizStates[qid] || {};
  let correct = false;

  if (q.type === 'FIB' || q.type === 'RW-FIB') {
    const answers = q.answers || [];
    let allCorrect = true;
    answers.forEach((ans, i) => {
      const blankEl = document.getElementById(`blank-${qid}-${i}`);
      if (!blankEl) { allCorrect = false; return; }
      const userAns = (blankEl.textContent || '').trim().toLowerCase();
      const isOk = userAns === ans.trim().toLowerCase();
      blankEl.classList.add(isOk ? 'correct-fill' : 'wrong-fill');
      if (!isOk) allCorrect = false;
    });
    correct = allCorrect;
  } else if (q.type === 'MCM' || q.type === 'MCS') {
    const correctIdxs = (q.options || []).map((o, i) => o.correct ? i : -1).filter(i => i !== -1);
    const userSel = state.selected || [];
    correct = arraysEqualSorted(correctIdxs, userSel);
    (q.options || []).forEach((o, i) => {
      const btn = document.getElementById(`opt-${qid}-${i}`);
      if (!btn) return;
      btn.disabled = true;
      if (o.correct) btn.classList.add('option-correct');
      else if (userSel.includes(i)) btn.classList.add('option-wrong');
    });
  } else if (q.type === 'RO') {
    const order = (quizStates[qid] || {}).order || [];
    correct = JSON.stringify(order) === JSON.stringify((q.options||[]).map((_,i)=>i));
  }

  if (correct) sessionScore++;
  DB.history.push({ date: todayStr(), qid, correct });

  const card = document.getElementById('sq-card');
  if (card) card.classList.add(correct ? 'correct' : 'wrong');

  document.getElementById('sq-exp').classList.add('show');
  document.getElementById('sq-actions').innerHTML = `
    <span style="font-family:'DM Mono',monospace;font-size:14px;${correct?'color:var(--correct)':'color:var(--wrong)'}">${correct ? '✓ 정답!' : '✗ 오답'}</span>
    <button class="btn btn-primary" style="margin-left:auto" onclick="nextSession()">다음 →</button>
  `;
}

function nextSession() {
  sessionIdx++;
  renderSessionCard();
}

function addQuestion() {
  const type = document.getElementById('f-type').value;
  const date = document.getElementById('f-date').value || todayStr();
  const passage = document.getElementById('f-passage').value.trim();
  const question = document.getElementById('f-question').value.trim();
  const explanation = document.getElementById('f-explanation').value.trim();
  const memo = document.getElementById('f-memo').value.trim();

  let options = [], answers = [];

  if (type === 'FIB' || type === 'RW-FIB') {
    options = [...document.querySelectorAll('.fib-opt')].map(i => i.value.trim()).filter(Boolean);
    const rawAnswers = document.getElementById('f-fib-answers').value;
    answers = rawAnswers.split(',').map(s => s.trim()).filter(Boolean);
    if (!passage) { showToast('지문을 입력해주세요.'); return; }
    if (!options.length) { showToast('단어 옵션을 추가해주세요.'); return; }
    if (!answers.length) { showToast('정답을 입력해주세요.'); return; }
  } else if (type === 'MCM' || type === 'MCS') {
    const rows = document.querySelectorAll('#mc-options-list .option-row');
    rows.forEach(row => {
      const text = row.querySelector('.mc-opt').value.trim();
      const correct = row.querySelector('.mc-correct').checked;
      if (text) options.push({ text, correct });
    });
    if (options.length < 2) { showToast('보기를 2개 이상 추가해주세요.'); return; }
  } else if (type === 'RO') {
    options = [...document.querySelectorAll('.ro-opt')].map(i => i.value.trim()).filter(Boolean);
    if (options.length < 2) { showToast('문장을 2개 이상 추가해주세요.'); return; }
  }

  const q = {
    id: Date.now().toString(),
    type, date, passage, question, options, answers, explanation, memo
  };

  DB.questions.push(q);
  saveDB();
  showToast('✓ 오답이 저장되었습니다!');
  resetAddForm();
  updateHeaderStats();
}

function resetAddForm() {
  document.getElementById('f-passage').value = '';
  document.getElementById('f-question').value = '';
  document.getElementById('f-explanation').value = '';
  document.getElementById('f-memo').value = '';
  document.getElementById('f-fib-answers').value = '';
  document.getElementById('fib-options-list').innerHTML = '';
  document.getElementById('mc-options-list').innerHTML = '';
  document.getElementById('ro-options-list').innerHTML = '';
}

// ═══════════════════════════════════════════════
//  IMPORT / EXPORT
// ═══════════════════════════════════════════════

function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pte-vault-${todayStr()}.json`;
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.questions) {
        // Merge
        const existingIds = new Set(DB.questions.map(q => q.id));
        data.questions.forEach(q => { if (!existingIds.has(q.id)) DB.questions.push(q); });
        if (data.history) {
          data.history.forEach(h => DB.history.push(h));
        }
        saveDB();
        showToast(`✓ ${data.questions.length}개 문제 가져오기 완료!`);
        renderDashboard();
      }
    } catch(err) { showToast('❌ JSON 파일 오류'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ═══════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateHeaderStats() {
  const { total, acc } = getStats();
  document.getElementById('hdr-total').textContent = total;
  document.getElementById('hdr-acc').textContent = acc !== null ? acc + '%' : '—';
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', () => {
  loadDB();
  document.getElementById('f-date').value = todayStr();

  renderDashboard();
  updateHeaderStats();
  updateFormByType();

  // Init form options
  addFIBOption(); addFIBOption(); addFIBOption();
  addMCOption(); addMCOption(); addMCOption();
  addROOption(); addROOption(); addROOption();
});
</script>
