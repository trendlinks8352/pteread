<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTE Academic Collocation</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c12;--surface:#13131c;--surface2:#1a1a26;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --accent:#a78bfa;--accent2:#7c3aed;
  --accent-dim:rgba(167,139,250,0.1);--accent-border:rgba(167,139,250,0.25);
  --text:#eeebff;--text-muted:#8880aa;--text-faint:#3f3d58;
  --green:#4ade80;--green-dim:rgba(74,222,128,0.1);--green-border:rgba(74,222,128,0.3);
  --red:#f87171;--red-dim:rgba(248,113,113,0.1);--red-border:rgba(248,113,113,0.3);
  --radius:14px;--radius-sm:9px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 70% 10%,rgba(124,58,237,0.08),transparent),radial-gradient(ellipse 50% 30% at 10% 80%,rgba(167,139,250,0.05),transparent);pointer-events:none;z-index:0}

/* ── TAB NAV ── */
.tab-nav{position:sticky;top:0;z-index:100;background:rgba(12,12,18,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:4px;padding:10px 1rem}
.tab-btn{background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);padding:8px 22px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .2s}
.tab-btn:hover{color:var(--text);border-color:var(--border)}
.tab-btn.active{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent)}

/* ── PAGES ── */
.page{display:none;padding:2.5rem 1rem 5rem}
.page.active{display:block}
.inner{max-width:700px;margin:0 auto;position:relative;z-index:1}
.inner-wide{max-width:960px;margin:0 auto;position:relative;z-index:1}

/* ── SHARED HEADER ── */
.header{text-align:center;margin-bottom:2rem}
.header-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-border);padding:5px 14px;border-radius:99px;margin-bottom:1rem}
.header h1{font-family:'DM Serif Display',serif;font-size:clamp(24px,5vw,40px);font-weight:400;line-height:1.1;margin-bottom:.5rem}
.header h1 em{color:var(--accent);font-style:normal}
.header p{font-size:13px;color:var(--text-muted)}

/* ── QUIZ HOME ── */
.home-section{margin-bottom:1rem}
.home-section-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px}
.mode-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.25rem}
.mode-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text-muted);cursor:pointer;text-align:center;transition:all .2s;line-height:1.5}
.mode-btn .mi{font-size:18px;display:block;margin-bottom:3px}
.mode-btn:hover,.mode-btn.active{border-color:var(--accent-border);color:var(--text);background:var(--accent-dim)}
.mode-btn.active{border-color:var(--accent);color:var(--accent)}
.range-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1.5rem}
.range-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 6px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text-muted);cursor:pointer;text-align:center;transition:all .2s}
.range-btn:hover,.range-btn.active{border-color:var(--accent-border);background:var(--accent-dim);color:var(--accent)}
.start-btn{width:100%;background:var(--accent2);border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;color:#fff;cursor:pointer;transition:background .15s,transform .1s;margin-bottom:.75rem}
.start-btn:hover{background:#6d28d9}
.start-btn:active{transform:scale(.99)}
.count-info{text-align:center;font-size:12px;color:var(--text-faint);margin-bottom:1rem}

/* ── QUIZ ── */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.progress-track{flex:1;height:3px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress-text{font-size:12px;color:var(--text-faint);white-space:nowrap}
.score-badge{font-size:12px;color:var(--accent);background:var(--accent-dim);border:1px solid var(--accent-border);padding:3px 10px;border-radius:99px;white-space:nowrap}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;margin-bottom:.75rem;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-type-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:.9rem}
.q-type-badge::before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}
.q-text{font-size:18px;line-height:1.65;color:var(--text);margin-bottom:1.4rem}
.blank{display:inline-block;border-bottom:2px solid var(--accent);color:var(--accent);font-weight:500;min-width:90px;padding:0 6px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 15px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text-muted);cursor:pointer;text-align:left;transition:all .15s;line-height:1.3}
.opt-btn:hover:not(:disabled){border-color:var(--accent-border);background:var(--accent-dim);color:var(--text)}
.opt-btn.correct{border-color:var(--green-border);background:var(--green-dim);color:var(--green)}
.opt-btn.wrong{border-color:var(--red-border);background:var(--red-dim);color:var(--red)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px}
.match-items{display:flex;flex-direction:column;gap:5px}
.match-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text-muted);cursor:pointer;transition:all .15s;min-height:40px;display:flex;align-items:center}
.match-item:hover:not(.matched):not(.wrong-flash){border-color:var(--accent-border);color:var(--text)}
.match-item.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.match-item.matched{border-color:var(--green-border);background:var(--green-dim);color:var(--green);cursor:default}
.match-item.wrong-flash{border-color:var(--red-border);background:var(--red-dim);color:var(--red)}
.feedback{margin-top:.9rem;padding:10px 14px;border-radius:var(--radius-sm);font-size:14px;line-height:1.5;animation:fadeUp .2s ease}
.feedback.ok{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border)}
.feedback.no{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border)}
.next-btn{width:100%;background:var(--accent2);border:none;border-radius:var(--radius-sm);padding:13px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;color:#fff;cursor:pointer;margin-top:.75rem;transition:background .15s,transform .1s}
.next-btn:hover{background:#6d28d9}
.next-btn:active{transform:scale(.99)}
.hint{font-size:12px;color:var(--text-faint);text-align:center;margin-top:.4rem}

/* ── FINAL ── */
.final-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;animation:fadeUp .3s ease}
.final-stars{font-size:28px;letter-spacing:6px;margin-bottom:1rem}
.final-score{font-family:'DM Serif Display',serif;font-size:72px;font-weight:400;color:var(--accent);line-height:1}
.final-denom{font-size:22px;color:var(--text-faint)}
.final-msg{font-size:15px;color:var(--text-muted);margin:.6rem 0 .3rem}
.final-pct{font-size:13px;color:var(--text-faint);margin-bottom:1.5rem}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.5rem}
.stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-num{font-size:20px;font-weight:500}
.stat-label{font-size:11px;color:var(--text-faint);margin-top:2px}
.final-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qhome-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 24px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .15s}
.qhome-btn:hover{border-color:var(--border2);color:var(--text)}
.restart-btn{background:transparent;border:1px solid var(--accent-border);border-radius:var(--radius-sm);padding:11px 24px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--accent);cursor:pointer;transition:background .15s,border-color .15s}
.restart-btn:hover{background:var(--accent-dim);border-color:var(--accent)}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.4rem;margin-bottom:.5rem;border-left:3px solid var(--red)}
.review-sentence{font-size:14px;color:var(--text-muted);margin-bottom:.3rem}
.review-answer{font-size:14px;color:var(--green)}
.review-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin:1.5rem 0 .75rem}

/* ── LIST PAGE ── */
.list-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}
.search-box{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border .2s}
.search-box::placeholder{color:var(--text-faint)}
.search-box:focus{border-color:var(--accent-border)}
.filter-wrap{display:flex;gap:5px;flex-wrap:wrap}
.filter-btn{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 11px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text-muted);cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent-border);background:var(--accent-dim);color:var(--accent)}
.list-stats{font-size:12px;color:var(--text-faint);margin-bottom:1.25rem}
.list-stats span{color:var(--accent)}
.letter-section{margin-bottom:2rem}
.letter-heading{font-family:'DM Serif Display',serif;font-size:26px;color:var(--accent);margin-bottom:.9rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.col-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;cursor:pointer;transition:all .15s}
.col-card:hover{border-color:var(--accent-border);background:var(--accent-dim)}
.col-card.starred{border-color:rgba(251,191,36,0.4);background:rgba(251,191,36,0.05)}
.col-w1{font-size:14px;font-weight:500;color:var(--text)}
.col-w2{font-size:13px;color:var(--text-muted);margin-top:2px}
.col-type{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);margin-top:3px}
.no-results{text-align:center;padding:3rem;color:var(--text-faint);font-size:14px}

@media(max-width:480px){
  .options{grid-template-columns:1fr}.q-text{font-size:16px}
  .mode-wrap{grid-template-columns:1fr}.range-wrap{grid-template-columns:repeat(2,1fr)}
  .final-score{font-size:56px}.col-grid{grid-template-columns:1fr 1fr}
  .list-controls{flex-direction:column}
}
</style>
</head>

<!-- TAB NAV -->
<nav class="tab-nav">

</nav>

<!-- QUIZ PAGE -->
<div class="page active" id="page-quiz">
  <div class="inner">

</div>

<!-- LIST PAGE -->

    </div>
    <div class="list-controls">
      <input class="search-box" id="searchBox" type="text" placeholder="검색... (예: significant, conduct)" oninput="renderList()">
      <div class="filter-wrap" id="filterBtns"></div>
    </div>
    <div class="list-stats" id="listStats"></div>
    <div id="listContainer"></div>
  </div>
</div>

// ================================================================
// TAB SWITCHING
// ================================================================
function showTab(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>{if(b.textContent.includes(t==='quiz'?'퀴즈':'목록'))b.classList.add('active');});
  window.scrollTo(0,0);
  if(t==='list'&&!listInitialized){initList();listInitialized=true;}
}

// ================================================================
// QUIZ ENGINE
// ================================================================
let qMode='mixed', qRange='all', questions=[], current=0, score=0, answered=false, matchState={}, wrongList=[];

const RANGES={
  all:{label:'전체 A–Z'},
  ag:{label:'A–G',test:w=>w[0].toLowerCase()<='g'},
  hm:{label:'H–M',test:w=>w[0].toLowerCase()>='h'&&w[0].toLowerCase()<='m'},
  nz:{label:'N–Z',test:w=>w[0].toLowerCase()>='n'},
};

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function getFills(){return qRange==='all'?FILLS:FILLS.filter(f=>RANGES[qRange].test(f[1]));}
function getMatches(){return qRange==='all'?MATCHES:MATCHES.filter(m=>RANGES[qRange].test(m[0][0]));}

function buildQ(){
  const F=shuffle(getFills());
  const M=shuffle(getMatches());
  const fills=F.map(f=>({type:'fill',sentence:f[0],answer:f[1],options:shuffle([f[1],f[2],f[3],f[4]])}));
  const matches=M.map(m=>({type:'match',pairs:m}));
  if(qMode==='fill')return fills;
  if(qMode==='match')return matches;
  const res=[];let fi=0,mi=0;
  while(fi<fills.length||mi<matches.length){
    if(fi<fills.length)res.push(fills[fi++]);
    if(fi<fills.length)res.push(fills[fi++]);
    if(fi<fills.length)res.push(fills[fi++]);
    if(mi<matches.length)res.push(matches[mi++]);
    if(mi<matches.length)res.push(matches[mi++]);
  }
  return res;
}

function quizHome(){
  const fC=getFills().length, mC=getMatches().length;
  const total=qMode==='fill'?fC:qMode==='match'?mC:fC+mC;
  document.getElementById('quiz-app').innerHTML=`
    <div class="home-section">
      <div class="home-section-label">모드</div>
      <div class="mode-wrap">
        ${[['fill','✏️','빈칸 채우기'],['match','🔗','매칭'],['mixed','🎲','혼합']].map(([k,i,l])=>`
          <button class="mode-btn${qMode===k?' active':''}" onclick="setQMode('${k}')">
            <span class="mi">${i}</span>${l}
          </button>`).join('')}
      </div>
    </div>
    <div class="home-section">
      <div class="home-section-label">범위</div>
      <div class="range-wrap">
        ${Object.entries(RANGES).map(([k,v])=>`
          <button class="range-btn${qRange===k?' active':''}" onclick="setQRange('${k}')">${v.label}</button>`).join('')}
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">퀴즈 시작 → 총 ${total}문제 전부 풀기</button>
    <p class="count-info">빈칸 ${fC}문항 + 매칭 ${mC}세트 · 매번 랜덤 순서로 출제</p>`;
}

function setQMode(m){qMode=m;quizHome();}
function setQRange(r){qRange=r;quizHome();}

function startQuiz(){
  questions=buildQ();current=0;score=0;answered=false;matchState={};wrongList=[];
  renderQ();
}

function nBtn(){
  const l=current+1<questions.length?`다음 (${current+2}/${questions.length}) →`:'결과 보기 →';
  return`<button class="next-btn" onclick="nxtQ()">${l}</button>`;
}

function renderQ(){
  const app=document.getElementById('quiz-app');
  if(current>=questions.length){finQ(app);return;}
  const q=questions[current];
  const prog=Math.round(current/questions.length*100);
  let h=`<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    <span class="progress-text">${current+1}/${questions.length}</span>
    <span class="score-badge">✦ ${score}</span>
  </div>`;
  if(q.type==='fill'){
    const disp=q.sentence.replace('__',`<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
    h+=`<div class="q-card">
      <div class="q-type-badge">빈칸 채우기</div>
      <div class="q-text">${disp}</div>
      <div class="options">${q.options.map(o=>`<button class="opt-btn" onclick="chkF(this,'${esc(o)}','${esc(q.answer)}')">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
    if(!answered)h+=`<p class="hint">알맞은 단어를 선택하세요</p>`;
  } else {
    const ls=shuffle(q.pairs.map(p=>p[0]));
    const rs=shuffle(q.pairs.map(p=>p[1]));
    matchState={pairs:q.pairs,ls,rs,sel:null,matched:[],total:q.pairs.length};
    h+=`<div class="q-card">
      <div class="q-type-badge">매칭하기 — 왼쪽 클릭 → 오른쪽 클릭</div>
      <div class="match-grid">
        <div><div class="match-col-label">단어 1</div><div class="match-items">${ls.map(l=>`<div class="match-item" id="L${ei(l)}" onclick="selL('${esc(l)}')">${l}</div>`).join('')}</div></div>
        <div><div class="match-col-label">단어 2</div><div class="match-items">${rs.map(r=>`<div class="match-item" id="R${ei(r)}" onclick="selR('${esc(r)}')">${r}</div>`).join('')}</div></div>
      </div>
      <div id="fb"></div>
    </div>`;
    if(!answered)h+=`<p class="hint">왼쪽 단어 클릭 → 오른쪽 단어 클릭</p>`;
  }
  if(answered)h+=nBtn();
  app.innerHTML=h;
}

function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function ei(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}

function chkF(btn,chosen,answer){
  if(answered)return;
  answered=true;
  const q=questions[current];
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const t=b.textContent.trim();
    if(t===answer)b.classList.add('correct');
    else if(t===chosen)b.classList.add('wrong');
  });
  const bl=document.getElementById('bl');
  if(bl)bl.textContent=answer;
  const fb=document.getElementById('fb');
  if(chosen===answer){score++;fb.innerHTML=`<div class="feedback ok">✓ 정답! <strong>${answer}</strong></div>`;}
  else{wrongList.push({type:'fill',sentence:q.sentence,answer});fb.innerHTML=`<div class="feedback no">✗ 오답. 정답: <strong>${answer}</strong></div>`;}
  document.getElementById('quiz-app').insertAdjacentHTML('beforeend',nBtn());
}

function selL(w){
  if(matchState.matched.includes(w))return;
  matchState.sel=w;
  matchState.ls.forEach(l=>{
    const el=document.getElementById('L'+ei(l));if(!el)return;
    if(matchState.matched.includes(l)){el.className='match-item matched';return;}
    el.className=l===w?'match-item selected':'match-item';
  });
}
function selR(w){
  if(!matchState.sel||matchState.matched.includes(w))return;
  const left=matchState.sel;
  const correct=matchState.pairs.find(p=>p[0]===left)?.[1];
  const lel=document.getElementById('L'+ei(left));
  const rel=document.getElementById('R'+ei(w));
  if(w===correct){
    matchState.matched.push(left);
    if(lel)lel.className='match-item matched';
    if(rel)rel.className='match-item matched';
    matchState.sel=null;
    if(matchState.matched.length===matchState.total){
      score++;
      const fb=document.getElementById('fb');
      if(fb)fb.innerHTML=`<div class="feedback ok" style="margin-top:10px">✓ 모두 정답!</div>`;
      answered=true;
      document.getElementById('quiz-app').insertAdjacentHTML('beforeend',nBtn());
    }
  } else {
    if(lel){lel.className='match-item wrong-flash';setTimeout(()=>{if(!matchState.matched.includes(left)&&lel)lel.className='match-item';},500);}
    if(rel){rel.className='match-item wrong-flash';setTimeout(()=>{if(!matchState.matched.includes(w)&&rel)rel.className='match-item';},500);}
    matchState.sel=null;
    matchState.ls.forEach(l=>{const el=document.getElementById('L'+ei(l));if(el&&!matchState.matched.includes(l))el.className='match-item';});
  }
}
function nxtQ(){current++;answered=false;matchState={};renderQ();}

function finQ(app){
  const pct=Math.round(score/questions.length*100);
  let stars='',msg='';
  if(pct>=90){stars='★★★★★';msg='완벽해요! 콜로케이션 마스터! 🎉';}
  else if(pct>=70){stars='★★★★☆';msg='훌륭해요! 거의 다 맞았네요.';}
  else if(pct>=50){stars='★★★☆☆';msg='좋아요! 조금 더 연습해봐요.';}
  else{stars='★★☆☆☆';msg='계속 하면 늘어요! 파이팅! 💪';}
  const uniq=[...new Map(wrongList.filter(w=>w.type==='fill').map(w=>[w.answer,w])).values()];
  const wrongHTML=uniq.length>0?`
    <div class="review-title">틀린 문제 복습 (${uniq.length}개)</div>
    ${uniq.map(w=>`<div class="review-card">
      <div class="review-sentence">${w.sentence.replace('__','___')}</div>
      <div class="review-answer">정답: <strong>${w.answer}</strong></div>
    </div>`).join('')}`:'';
  app.innerHTML=`
    <div class="final-card">
      <div class="final-stars">${stars}</div>
      <div style="margin-bottom:.75rem"><span class="final-score">${score}</span><span class="final-denom"> / ${questions.length}</span></div>
      <div class="final-msg">${msg}</div>
      <div class="final-pct">정답률 ${pct}%</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${score}</div><div class="stat-label">정답</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--red)">${questions.length-score}</div><div class="stat-label">오답</div></div>
        <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-label">정답률</div></div>
      </div>
      <div class="final-btns">
        <button class="qhome-btn" onclick="quizHome()">← 홈으로</button>
        <button class="restart-btn" onclick="startQuiz()">다시 풀기 ↺</button>
      </div>
    </div>${wrongHTML}`;
}

// ================================================================
// LIST ENGINE
// ================================================================
let listInitialized=false, listLetter='ALL', listSearch='';
const TYPE_LABELS={"adj+n":"형+명","v+n":"동+명","adv+adj":"부+형","adv+vpp":"부+과분","adv+v":"부+동","n+n":"명+명","v+adj":"동+형","v+adv":"동+부"};
let starred=new Set();
try{starred=new Set(JSON.parse(localStorage.getItem('pte_starred')||'[]'));}catch(e){}
function saveStarred(){try{localStorage.setItem('pte_starred',JSON.stringify([...starred]));}catch(e){}}

function initList(){
  const LETTERS=[...new Set(LIST_DATA.map(d=>d[0][0].toUpperCase()))].sort();
  const wrap=document.getElementById('filterBtns');
  wrap.innerHTML=`<button class="filter-btn active" onclick="setLL('ALL')">전체</button>`
    +LETTERS.map(l=>`<button class="filter-btn" onclick="setLL('${l}')">${l}</button>`).join('');
  renderList();
}
function setLL(l){
  listLetter=l;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.textContent===l));
  renderList();
}
function renderList(){
  const s=listSearch.toLowerCase();
  const filtered=LIST_DATA.filter(d=>{
    const lOk=listLetter==='ALL'||d[0][0].toUpperCase()===listLetter;
    const sOk=!s||d[0].toLowerCase().includes(s)||d[1].toLowerCase().includes(s);
    return lOk&&sOk;
  });
  document.getElementById('listStats').innerHTML=`전체 <span>${LIST_DATA.length.toLocaleString()}</span>개 · 표시 <span>${filtered.length.toLocaleString()}</span>개 · ⭐ 즐겨찾기 ${starred.size}개`;
  if(!filtered.length){document.getElementById('listContainer').innerHTML='<div class="no-results">검색 결과가 없어요 😅</div>';return;}
  const groups={};
  filtered.forEach(d=>{const l=d[0][0].toUpperCase();if(!groups[l])groups[l]=[];groups[l].push(d);});
  document.getElementById('listContainer').innerHTML=Object.entries(groups).map(([l,items])=>`
    <div class="letter-section">
      <div class="letter-heading">${l}</div>
      <div class="col-grid">${items.map(d=>{
        const key=d[0]+'|'+d[1];
        const isStar=starred.has(key);
        return`<div class="col-card${isStar?' starred':''}" onclick="toggleStar('${key.replace(/'/g,"\\'")}')">
          <div class="col-w1">${d[0]}</div>
          <div class="col-w2">${d[1]}</div>
          <div class="col-type">${TYPE_LABELS[d[2]]||d[2]}${isStar?' ⭐':''}</div>
        </div>`;
      }).join('')}</div>
    </div>`).join('');
}
function toggleStar(key){
  if(starred.has(key))starred.delete(key);else starred.add(key);
  saveStarred();renderList();
}
document.getElementById('searchBox').addEventListener('input',e=>{listSearch=e.target.value;renderList();});

// INIT
quizHome();
</script>
