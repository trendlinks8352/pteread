let mode='mixed', rangeKey='all', questions=[], current=0, score=0, answered=false, matchState={};
const QUIZ_SIZE=20;

const RANGES={
  all:{label:'전체 A–Z',fills:()=>FILLS,matches:()=>MATCHES},
  ag:{label:'A–G',fills:()=>FILLS.filter(f=>f[1][0]<='g'),matches:()=>MATCHES.filter(m=>m[0][0][0]<='g')},
  hm:{label:'H–M',fills:()=>FILLS.filter(f=>f[1][0]>='h'&&f[1][0]<='m'),matches:()=>MATCHES.filter(m=>m[0][0][0]>='h'&&m[0][0][0]<='m')},
  nz:{label:'N–Z',fills:()=>FILLS.filter(f=>f[1][0]>='n'),matches:()=>MATCHES.filter(m=>m[0][0][0]>='n')},
};

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

function buildQ(){
  const F=shuffle(RANGES[rangeKey].fills());
  const M=shuffle(RANGES[rangeKey].matches());
  if(mode==='fill') return F.slice(0,QUIZ_SIZE).map(f=>({type:'fill',sentence:f[0],answer:f[1],options:shuffle([f[1],f[2],f[3],f[4]])}));
  if(mode==='match') return M.slice(0,QUIZ_SIZE).map(m=>({type:'match',pairs:m}));
  const fills=F.slice(0,12).map(f=>({type:'fill',sentence:f[0],answer:f[1],options:shuffle([f[1],f[2],f[3],f[4]])}));
  const matches=M.slice(0,8).map(m=>({type:'match',pairs:m}));
  return shuffle([...fills,...matches]);
}

function home(){
  const rng=RANGES[rangeKey];
  const fCount=rng.fills().length, mCount=rng.matches().reduce((a,b)=>a+b.length,0);
  document.getElementById('app').innerHTML=`
    <div class="mode-wrap">
      ${[['fill','✏️','빈칸 채우기'],['match','🔗','매칭하기'],['mixed','🎲','혼합']].map(([k,i,l])=>`
        <button class="mode-btn${mode===k?' active':''}" onclick="setMode('${k}')">
          <span class="mi">${i}</span>${l}<br>
          <span style="font-size:11px;color:var(--text-faint)">${k==='fill'?`빈칸 ${QUIZ_SIZE}문제`:k==='match'?`매칭 ${QUIZ_SIZE}문제`:'빈칸12+매칭8'}</span>
        </button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:8px;text-align:center">범위 선택</div>
    <div class="range-wrap">
      ${Object.entries(RANGES).map(([k,v])=>`
        <button class="range-btn${rangeKey===k?' active':''}" onclick="setRange('${k}')">${v.label}</button>`).join('')}
    </div>
    <button class="start-btn" onclick="start()">퀴즈 시작하기 →</button>
    <p class="count-info">현재 범위: ${rng.label} · 빈칸 ${fCount}문항 + 매칭 ${mCount}쌍 수록</p>`;
}

function setMode(m){mode=m;home();}
function setRange(r){rangeKey=r;home();}

function start(){
  questions=buildQ();current=0;score=0;answered=false;matchState={};render();
}

function nBtn(){const l=current+1<questions.length?'다음 문제 →':'결과 보기 →';return`<button class="next-btn" onclick="nxt()">${l}</button>`;}

function render(){
  const app=document.getElementById('app');
  if(current>=questions.length){fin(app);return;}
  const q=questions[current];
  const prog=Math.round(current/questions.length*100);
  let h=`<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    <span class="progress-text">${current+1}/${questions.length}</span>
    <span class="score-badge">✦ ${score}</span>
  </div>`;
  if(q.type==='fill'){
    const disp=q.sentence.replace('__',`<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`);
    h+=`<div class="q-card">
      <div class="q-type-badge">빈칸 채우기</div>
      <div class="q-text">${disp}</div>
      <div class="options">${q.options.map(o=>`<button class="opt-btn" onclick="chkF(this,'${esc(o)}','${esc(q.answer)}')">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
    if(!answered)h+=`<p class="hint">알맞은 단어를 선택하세요</p>`;
  } else {
    const ls=shuffle(q.pairs.map(p=>p[0]));
    const rs=shuffle(q.pairs.map(p=>p[1]));
    matchState={pairs:q.pairs,ls,rs,sel:null,matched:[],total:q.pairs.length};
    h+=`<div class="q-card">
      <div class="q-type-badge">매칭하기 — 왼쪽 선택 → 오른쪽 선택</div>
      <div class="match-grid">
        <div><div class="match-col-label">단어 1</div><div class="match-items">${ls.map(l=>`<div class="match-item" id="L${ei(l)}" onclick="selL('${esc(l)}')">${l}</div>`).join('')}</div></div>
        <div><div class="match-col-label">단어 2</div><div class="match-items">${rs.map(r=>`<div class="match-item" id="R${ei(r)}" onclick="selR('${esc(r)}')">${r}</div>`).join('')}</div></div>
      </div>
      <div id="fb"></div>
    </div>`;
    if(!answered)h+=`<p class="hint">왼쪽 클릭 → 오른쪽 클릭</p>`;
  }
  if(answered)h+=nBtn();
  app.innerHTML=h;
}

function esc(s){return s.replace(/'/g,"\\'");}
function ei(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}

function chkF(btn,chosen,answer){
  if(answered)return;
  answered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled=true;
    const t=b.textContent.trim();
    if(t===answer)b.classList.add('correct');
    else if(t===chosen)b.classList.add('wrong');
  });
  const bl=document.getElementById('bl');
  if(bl)bl.textContent=answer;
  const fb=document.getElementById('fb');
  if(chosen===answer){score++;fb.innerHTML=`<div class="feedback ok">✓ 정답! <strong>${answer}</strong></div>`;}
  else{fb.innerHTML=`<div class="feedback no">✗ 오답. 정답: <strong>${answer}</strong></div>`;}
  document.getElementById('app').insertAdjacentHTML('beforeend',nBtn());
}

function selL(w){
  if(matchState.matched.includes(w))return;
  matchState.sel=w;
  matchState.ls.forEach(l=>{
    const el=document.getElementById('L'+ei(l));
    if(!el)return;
    if(matchState.matched.includes(l)){el.className='match-item matched';return;}
    el.className=l===w?'match-item selected':'match-item';
  });
}

function selR(w){
  if(!matchState.sel)return;
  if(matchState.matched.includes(w))return;
  const left=matchState.sel;
  const correct=matchState.pairs.find(p=>p[0]===left)?.[1];
  const lel=document.getElementById('L'+ei(left));
  const rel=document.getElementById('R'+ei(w));
  if(w===correct){
    matchState.matched.push(left);
    if(lel)lel.className='match-item matched';
    if(rel)rel.className='match-item matched';
    matchState.sel=null;
    if(matchState.matched.length===matchState.total){
      score++;
      const fb=document.getElementById('fb');
      if(fb)fb.innerHTML=`<div class="feedback ok" style="margin-top:10px">✓ 모두 정답!</div>`;
      answered=true;
      document.getElementById('app').insertAdjacentHTML('beforeend',nBtn());
    }
  } else {
    if(lel){lel.className='match-item wrong-flash';setTimeout(()=>{if(!matchState.matched.includes(left)&&lel)lel.className='match-item';},500);}
    if(rel){rel.className='match-item wrong-flash';setTimeout(()=>{if(!matchState.matched.includes(w)&&rel)rel.className='match-item';},500);}
    matchState.sel=null;
    matchState.ls.forEach(l=>{const el=document.getElementById('L'+ei(l));if(el&&!matchState.matched.includes(l))el.className='match-item';});
  }
}

function nxt(){current++;answered=false;matchState={};render();}

function fin(app){
  const pct=Math.round(score/questions.length*100);
  let stars='',msg='';
  if(pct>=90){stars='★★★★★';msg='완벽해요! 콜로케이션 마스터! 🎉';}
  else if(pct>=70){stars='★★★★☆';msg='훌륭해요! 거의 다 맞았네요.';}
  else if(pct>=50){stars='★★★☆☆';msg='좋아요! 조금 더 연습해봐요.';}
  else{stars='★★☆☆☆';msg='계속 하면 늘어요! 파이팅! 💪';}
  app.innerHTML=`
    <div class="final-card">
      <div class="final-stars">${stars}</div>
      <div style="margin-bottom:.75rem"><span class="final-score">${score}</span><span class="final-denom"> / ${questions.length}</span></div>
      <div class="final-msg">${msg}</div>
      <div class="final-pct">정답률 ${pct}%</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" style="color:var(--green)">${score}</div><div class="stat-label">정답</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--red)">${questions.length-score}</div><div class="stat-label">오답</div></div>
        <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-label">정답률</div></div>
      </div>
      <div class="final-btns">
        <button class="home-btn" onclick="home()">← 홈으로</button>
        <button class="restart-btn" onclick="start()">다시 풀기 ↺</button>
      </div>
    </div>`;
}

home();
</script>
</body>
</html>
